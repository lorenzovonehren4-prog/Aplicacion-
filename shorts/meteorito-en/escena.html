<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:absolute;inset:0;overflow:hidden;background:#000;font-family:Inter,sans-serif;font-weight:900}
canvas,.ov{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 45%,transparent 42%,rgba(0,0,0,.7) 100%)}
#bars:before,#bars:after{content:"";position:absolute;left:0;right:0;height:230px}
#bars:before{top:0;background:linear-gradient(#000c,transparent)}
#bars:after{bottom:0;height:380px;background:linear-gradient(transparent,#000c)}
.txt{position:absolute;left:0;width:1080px;text-align:center;text-transform:uppercase;color:#fff;
  -webkit-text-stroke:18px #000;paint-order:stroke fill;letter-spacing:-1px;line-height:1.02;
  text-shadow:0 10px 0 #000,0 0 40px rgba(0,0,0,.8)}
#cap{top:1130px;font-size:104px;padding:0 60px}
#cap b{color:#ffd400;font-weight:900}
#title{top:210px;font-size:112px;padding:0 50px}
#title b{color:#ffd400;font-weight:900}
#sub{top:470px;font-size:70px;color:#ff8a1e}
#num{top:150px;font-size:300px;letter-spacing:-8px;-webkit-text-stroke:26px #000;text-transform:none}
#lab{top:500px;font-size:58px;-webkit-text-stroke:12px #000;color:#ffd400}
#pips{position:absolute;top:120px;left:0;width:1080px;display:flex;gap:14px;justify-content:center}
#pips i{width:120px;height:14px;border-radius:7px;background:#fff4;border:3px solid #000}
#pips i.on{background:#ffd400}
#alert{position:absolute;top:150px;left:50%;transform:translateX(-50%);background:#e8121c;color:#fff;font-size:76px;
  padding:14px 46px 16px;border:8px solid #000;border-radius:18px;letter-spacing:4px;white-space:nowrap;box-shadow:0 12px 0 #000}
#stat{top:760px;font-size:150px;color:#ff3b30;-webkit-text-stroke:22px #000}
</style></head><body>
<div id="stage">
  <canvas id="sc" width="1080" height="1920"></canvas>
  <canvas id="fx" width="1080" height="1920"></canvas>
  <div class="ov" id="siren"></div>
  <div class="ov" id="vig"></div><div class="ov" id="bars"></div>
  <div id="pips"><i></i><i></i><i></i></div>
  <div id="alert">⚠ WARNING</div>
  <div class="txt" id="title"></div><div class="txt" id="sub"></div>
  <div class="txt" id="num"></div><div class="txt" id="lab"></div>
  <div class="txt" id="stat"></div>
  <div class="txt" id="cap"></div>
  <div class="ov" id="dark" style="background:#000;opacity:0"></div>
  <div class="ov" id="flash" style="background:#fff;opacity:0"></div>
</div>
<script>
// Short «¿Qué pasaría si cae un meteorito?»: todo se dibuja con código, cuadro a cuadro, en función de t.
const TL=window.__TL__, W=1080, H=1920;
const $=id=>document.getElementById(id);
const S={}; TL.segs.forEach((s,i)=>{S[s.id]=s; s.end=(TL.segs[i+1]?TL.segs[i+1].start:TL.total)});
const T=id=>S[id].start, D=id=>S[id].dur;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k, k01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2, eout=k=>1-Math.pow(1-k,3), ein=k=>k*k*k;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const mod=(a,n)=>((a%n)+n)%n;
const g=$('sc').getContext('2d'), ctx=$('fx').getContext('2d');

// ---------- piezas ----------
function sky(c0,c1,c2){ const s=g.createLinearGradient(0,0,0,H); s.addColorStop(0,c0); s.addColorStop(.6,c1); s.addColorStop(1,c2||c1); g.fillStyle=s; g.fillRect(-60,-60,W+120,H+120); }
function stars(n,t,maxY,seed=0){ for(let i=0;i<n;i++){ const a=.25+.7*rnd(i*3.3+seed)*(.6+.4*Math.sin(t*(1+rnd(i)*3)+i)); g.fillStyle=`rgba(255,255,255,${a})`; const z=2+rnd(i*1.3)*3; g.fillRect(rnd(i*7.1+seed)*W,rnd(i*9.7+seed)*maxY,z,z); } }
function glow(x,y,r,col,a=1){ g.save(); g.globalCompositeOperation='lighter'; const q=g.createRadialGradient(x,y,0,x,y,r); q.addColorStop(0,col.replace('A',a)); q.addColorStop(1,col.replace('A',0)); g.fillStyle=q; g.beginPath(); g.arc(x,y,r,0,7); g.fill(); g.restore(); }
function rock(x,y,R,seed,rot=0){ g.save(); g.translate(x,y); g.rotate(rot); g.beginPath();
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, rr=R*(.84+.2*rnd(i*4.7+seed)); g[i?'lineTo':'moveTo'](Math.cos(a)*rr,Math.sin(a)*rr); } g.closePath();
  const q=g.createRadialGradient(-R*.4,R*.4,R*.1,0,0,R); q.addColorStop(0,'#ffd27a'); q.addColorStop(.4,'#b8431a'); q.addColorStop(1,'#2a120c'); g.fillStyle=q; g.fill(); g.strokeStyle='#000'; g.lineWidth=Math.max(3,R*.06); g.stroke();
  for(let i=0;i<6;i++){ const a=rnd(i*3.1+seed)*7, d=R*(.15+.55*rnd(i*8.3+seed)); g.fillStyle='rgba(20,8,5,.5)'; g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d,R*(.06+.1*rnd(i*2.2)),0,7); g.fill(); } g.restore(); }
// Meteorito con estela de fuego: ang es hacia dónde vuela.
function meteor(x,y,R,ang,t,len=14){ const bx=-Math.cos(ang), by=-Math.sin(ang);
  g.save(); g.globalCompositeOperation='lighter';
  for(let i=70;i>=0;i--){ const d=i/70, dist=d*R*len, j=(rnd(i*5.1+Math.floor(t*24)*.37)-.5)*R*(.5+d*2.2);
    const px=x+bx*dist-by*j, py=y+by*dist+bx*j, r=R*(1.25-d*.75)*(.8+.4*rnd(i+Math.floor(t*30)));
    const col=d<.25?`rgba(255,240,180,${.5})`:d<.6?`rgba(255,140,30,${.34*(1-d*.6)})`:`rgba(220,50,10,${.22*(1-d)})`;
    g.fillStyle=col; g.beginPath(); g.arc(px,py,r,0,7); g.fill(); }
  g.restore(); glow(x,y,R*3.2,'rgba(255,170,60,A)',.75); rock(x,y,R,3,t*2); glow(x+Math.cos(ang)*R*.5,y+Math.sin(ang)*R*.5,R*1.3,'rgba(255,255,230,A)',.9); }
function flame(x,y,w,h,t,seed){ g.save(); g.globalCompositeOperation='lighter';
  for(const [sc,col] of [[1,'rgba(255,60,10,.75)'],[.68,'rgba(255,150,20,.8)'],[.38,'rgba(255,235,150,.85)']]){
    const hh=h*sc*(.82+.18*Math.sin(t*9+seed*3)), ww=w*sc, tip=Math.sin(t*6.3+seed)*w*.25;
    g.fillStyle=col; g.beginPath(); g.moveTo(x-ww/2,y); g.bezierCurveTo(x-ww*.7,y-hh*.45,x-ww*.1+tip*.4,y-hh*.6,x+tip,y-hh);
    g.bezierCurveTo(x+ww*.2+tip*.3,y-hh*.55,x+ww*.75,y-hh*.4,x+ww/2,y); g.closePath(); g.fill(); } g.restore(); }
function smoke(x,y,r,t,seed,a=.5){ for(let i=0;i<7;i++){ const k=mod(t*.22+rnd(i*3+seed),1); g.fillStyle=`rgba(18,14,16,${a*(1-k)})`; g.beginPath(); g.arc(x+Math.sin(i+t*.7+seed)*r*.6+k*r*.8,y-k*r*5,r*(.6+k*1.3),0,7); g.fill(); } }
function building(x,base,w,h,col,seed,lit='#ffd98a',pLit=.5){ g.fillStyle=col; g.fillRect(x,base-h,w,h); const cols=Math.max(2,Math.round(w/46)), rows=Math.max(2,Math.round(h/58));
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){ if(rnd(seed*13+r*5+c*3)<pLit){ g.fillStyle=lit; g.fillRect(x+10+c*(w-20)/cols+5,base-h+12+r*(h-16)/rows,(w-20)/cols-10,(h-16)/rows*.5); } } }
function person(x,y,h,up,col='#06080c'){ g.fillStyle=col; g.strokeStyle=col; g.lineCap='round';
  g.beginPath(); g.arc(x,y-h*.9,h*.085,0,7); g.fill();
  g.beginPath(); g.roundRect(x-h*.12,y-h*.8,h*.24,h*.42,h*.06); g.fill();
  g.fillRect(x-h*.11,y-h*.42,h*.09,h*.42); g.fillRect(x+h*.02,y-h*.42,h*.09,h*.42);
  g.lineWidth=h*.065; g.beginPath(); g.moveTo(x+h*.1,y-h*.74); if(up){ g.lineTo(x+h*.24,y-h*.92); g.lineTo(x+h*.3,y-h*1.08);} else { g.lineTo(x+h*.16,y-h*.5);} g.stroke();
  g.beginPath(); g.moveTo(x-h*.1,y-h*.74); g.lineTo(x-h*.17,y-h*.5); g.stroke(); }
function truck(x,y,s,t,moving){ g.save(); g.translate(x,y+(moving?Math.sin(t*19)*3:0)); g.scale(s,s); g.lineJoin='round';
  const ph=Math.floor(t*6)%2;
  g.save(); g.globalCompositeOperation='lighter'; const hb=g.createLinearGradient(650,0,1150,0); hb.addColorStop(0,'rgba(255,240,170,.5)'); hb.addColorStop(1,'rgba(255,240,170,0)'); g.fillStyle=hb; g.beginPath(); g.moveTo(645,-110); g.lineTo(1150,-190); g.lineTo(1150,10); g.lineTo(645,-80); g.fill(); g.restore();
  g.fillStyle='#8d949e'; g.strokeStyle='#000'; g.lineWidth=6; g.fillRect(20,-292,400,16); g.strokeRect(20,-292,400,16); for(let i=0;i<9;i++) g.fillRect(40+i*44,-292,6,16);
  g.fillStyle='#d3141d'; g.beginPath(); g.roundRect(0,-268,440,206,10); g.fill(); g.stroke();
  g.beginPath(); g.roundRect(440,-250,205,188,[10,46,10,10]); g.fill(); g.stroke();
  g.fillStyle='#8f0d14'; g.fillRect(4,-108,636,44); g.fillStyle='#fff'; g.fillRect(4,-168,636,22); g.fillStyle='#ffd400'; g.fillRect(4,-146,636,8);
  g.strokeStyle='rgba(0,0,0,.55)'; g.lineWidth=4; for(const xx of [110,220,330]){ g.beginPath(); g.moveTo(xx,-262); g.lineTo(xx,-172); g.stroke(); }
  g.strokeStyle='#000'; g.lineWidth=6; g.fillStyle='#9fd8ff'; g.beginPath(); g.roundRect(468,-232,150,74,[6,30,6,6]); g.fill(); g.stroke();
  g.fillStyle='rgba(255,255,255,.55)'; g.beginPath(); g.moveTo(560,-232); g.lineTo(596,-232); g.lineTo(556,-158); g.lineTo(520,-158); g.fill();
  g.fillStyle='#b8bec8'; g.fillRect(630,-92,34,30); g.strokeRect(630,-92,34,30); g.fillStyle='#fff3b0'; g.beginPath(); g.arc(640,-112,13,0,7); g.fill(); g.stroke();
  g.fillStyle=ph?'#ff2030':'#5a0a10'; g.fillRect(476,-276,54,26); g.strokeRect(476,-276,54,26); g.fillStyle=ph?'#0a2260':'#2f7bff'; g.fillRect(530,-276,54,26); g.strokeRect(530,-276,54,26);
  for(const wx of [100,330,545]){ g.fillStyle='#0a0a0c'; g.beginPath(); g.arc(wx,-50,54,0,7); g.fill(); g.stroke(); g.fillStyle='#9aa1ab'; g.beginPath(); g.arc(wx,-50,24,0,7); g.fill();
    g.strokeStyle='#30343a'; g.lineWidth=7; const a0=moving?t*16:0; for(let i=0;i<4;i++){ const a=a0+i*Math.PI/2; g.beginPath(); g.moveTo(wx,-50); g.lineTo(wx+Math.cos(a)*22,-50+Math.sin(a)*22); g.stroke(); } g.strokeStyle='#000'; g.lineWidth=6; }
  g.restore();
  g.save(); g.translate(x,y); g.scale(s,s); if(ph) glow(503,-263,330,'rgba(255,20,40,A)',.85); else glow(557,-263,330,'rgba(40,110,255,A)',.85); g.restore(); }
function shockRing(x,y,r,a,w=50){ if(a<=0||r<=0) return; g.save(); g.globalCompositeOperation='lighter'; g.strokeStyle=`rgba(255,235,200,${a})`; g.lineWidth=w; g.beginPath(); g.arc(x,y,r,0,7); g.stroke(); g.restore(); }

// ---------- escenas ----------
// 1. Calle de noche: travelling junto al camión de bomberos; la cámara sube hacia el meteorito.
function meteorClose(t){ const k=t/.7; sky('#03070f','#0c2030','#3a1c10'); stars(60,t,H,2); const x=lerp(900,300,k), y=lerp(330,1100,k); glow(x,y,1300,'rgba(255,120,30,A)',.6); meteor(x,y,170,2.22,t,9); }
function street(t){ const tilt=eio(k01(t,T('h2')+D('h2')*.55,T('h2')+D('h2')*.55+.5)), back=t>=T('f1'), tt=back?t-T('f1'):t*1.8; const off=tilt*620*(back?0:1)+(back?620:0);
  const mk=back?k01(t,T('f2'),TL.total):k01(t,0,T('s1a')); const mx=back?lerp(700,560,eio(mk)):lerp(940,480,mk), my=(back?lerp(430,560,eio(mk)):lerp(250,640,mk)), mR=back?lerp(26,170,ein(mk)):lerp(34,74,mk);
  sky(back?'#02040c':'#040a14',back?'#0b1830':'#10283a','#3a2416'); stars(70,t,900,1);
  glow(mx,my,900,'rgba(255,120,30,A)',back?.25+mk*.5:.38);
  for(let i=0;i<6;i++){ const cx=mod(rnd(i*7)*1400-tt*14*(1+rnd(i)),1500)-200, cy=120+rnd(i*3)*520; g.fillStyle='rgba(8,14,22,.88)'; for(let j=0;j<5;j++){ g.beginPath(); g.ellipse(cx+j*70,cy+Math.sin(j*2+i)*24,110,52,0,0,7); g.fill(); }
    g.fillStyle='rgba(255,130,40,.16)'; for(let j=0;j<5;j++){ g.beginPath(); g.ellipse(cx+j*70,cy+34+Math.sin(j*2+i)*24,90,20,0,0,7); g.fill(); } }
  meteor(mx,my,mR,2.42,t,13);
  g.save(); g.translate(0,off);
  const base=1380, sp=back?0:1;
  for(let i=0;i<14;i++){ const w=150+rnd(i*2.1)*90, x=mod(i*230-tt*70*sp,14*230)-260; building(x,base,w,300+rnd(i*5.3)*520,'#0b1a28',i,'#f2b85a',.3); }
  for(let i=0;i<9;i++){ const w=240+rnd(i*4.1)*140, x=mod(i*420-tt*210*sp,9*420)-420; building(x,base,w,420+rnd(i*9.3)*600,'#06101a',i+40,'#ffd98a',.42); }
  g.fillStyle='#1a1d22'; g.fillRect(-60,base,W+120,70); g.fillStyle='#0c0e12'; g.fillRect(-60,base+70,W+120,H);
  for(let i=0;i<5;i++){ const x=mod(i*520-tt*640*sp,5*520)-260; g.fillStyle='#05070a'; g.fillRect(x,base-520,14,520); g.fillRect(x,base-520,110,12); glow(x+110,base-500,150,'rgba(255,190,90,A)',.8); g.fillStyle='#ffe2a0'; g.beginPath(); g.arc(x+110,base-504,14,0,7); g.fill(); }
  for(let i=0;i<7;i++){ const x=mod(i*380+140-tt*640*sp,7*380)-200; person(x,base+30,150+rnd(i*3)*40,true); }
  for(let i=0;i<8;i++){ const x=mod(i*300-tt*1100*sp,8*300)-300; g.fillStyle='#d9d2b0'; g.fillRect(x,base+300,150,14); }
  const ph=Math.floor(t*6)%2; g.save(); g.globalCompositeOperation='lighter'; const rf=g.createLinearGradient(0,base+150,0,base+520); rf.addColorStop(0,ph?'rgba(255,30,40,.45)':'rgba(40,110,255,.45)'); rf.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=rf; g.fillRect(120,base+150,780,370); g.restore();
  if(!back) truck(150,base+250,1.12,t,true); else { // de vuelta: observatorio vigilando
    g.fillStyle='#050a14'; g.beginPath(); g.moveTo(-60,base+80); g.quadraticCurveTo(540,base-420,W+60,base+80); g.fill(); }
  g.restore();
  if(back){ const by=1380+620-470+0; // cúpula
    g.save(); g.translate(0,0); const dy=1560; g.fillStyle='#0a1424'; g.beginPath(); g.moveTo(-60,H); g.lineTo(-60,dy+60); g.quadraticCurveTo(540,dy-260,W+60,dy+60); g.lineTo(W+60,H); g.fill();
    g.fillStyle='#c9d3e6'; g.strokeStyle='#000'; g.lineWidth=6; g.fillRect(400,dy-190,280,150); g.strokeRect(400,dy-190,280,150); g.beginPath(); g.arc(540,dy-190,140,Math.PI,0); g.closePath(); g.fill(); g.stroke();
    g.fillStyle='#0a1424'; g.fillRect(520,dy-330,40,140); const a=-1.15+Math.sin(t*.9)*.12; g.save(); g.translate(540,dy-250); g.rotate(a); g.fillStyle='#e9eef9'; g.fillRect(0,-22,210,44); g.strokeRect(0,-22,210,44); g.restore();
    g.save(); g.globalCompositeOperation='lighter'; const bx=540+Math.cos(a)*200, byy=dy-250+Math.sin(a)*200; const q=g.createLinearGradient(bx,byy,mx,my); q.addColorStop(0,'rgba(120,200,255,.4)'); q.addColorStop(1,'rgba(120,200,255,0)'); g.fillStyle=q; g.beginPath(); g.moveTo(bx-14,byy); g.lineTo(mx-90,my); g.lineTo(mx+90,my); g.lineTo(bx+14,byy); g.fill(); g.restore();
    const rr=mR*2.2+20+Math.sin(t*8)*6; g.strokeStyle='#7fe0ff'; g.lineWidth=6; g.beginPath(); g.arc(mx,my,rr,0,7); g.stroke(); for(let i=0;i<4;i++){ const an=i*Math.PI/2+t; g.beginPath(); g.moveTo(mx+Math.cos(an)*rr,my+Math.sin(an)*rr); g.lineTo(mx+Math.cos(an)*(rr+36),my+Math.sin(an)*(rr+36)); g.stroke(); }
    g.restore(); } }

// 2. Comparación de tamaños.
function compare(kind,t0,t){ const q=k01(t,t0,t0+.45), e2=eout(q), base=1500;
  sky('#05060d',['#1a1030','#2a0d0d','#120a26'][kind],'#000'); stars(110,t,base,kind*9);
  g.fillStyle='#0b0b12'; g.fillRect(-60,base,W+120,H); g.fillStyle='#ffd400'; g.fillRect(-60,base,W+120,6);
  const hpx=[520,640,760][kind]*e2;
  if(kind<2){ const bh=[520,640][kind], bw=kind?210:260; building(150,base,bw,bh,'#1c2233',kind+3,'#ffd98a',.55); g.strokeStyle='#5b6a91'; g.lineWidth=5; g.strokeRect(150,base-bh,bw,bh); person(150+bw+50,base,kind?32:86,false,'#fff'); }
  else { g.fillStyle='#46527a'; g.beginPath(); g.moveTo(0,base); g.lineTo(140,base-360); g.lineTo(230,base-290); g.lineTo(330,base-668); g.lineTo(430,base-380); g.lineTo(520,base-430); g.lineTo(640,base); g.closePath(); g.fill();
    g.fillStyle='#e9eef9'; g.beginPath(); g.moveTo(330,base-668); g.lineTo(292,base-520); g.lineTo(330,base-560); g.lineTo(372,base-530); g.closePath(); g.fill();
    g.font='900 40px Inter'; g.fillStyle='#9fb0d8'; g.textAlign='left'; g.fillText('EVEREST · 8.8 km',70,base+70);
    g.setLineDash([24,18]); g.strokeStyle='rgba(159,176,216,.8)'; g.lineWidth=4; g.beginPath(); g.moveTo(0,base-760); g.lineTo(W,base-760); g.stroke(); g.setLineDash([]);
    const px=mod(t*120,1300)-100; g.fillStyle='#e9eef9'; g.beginPath(); g.moveTo(px,base-772); g.lineTo(px+70,base-766); g.lineTo(px,base-760); g.lineTo(px-26,base-790); g.fill(); }
  const cx=kind<2?740:800, cy=base-hpx/2-(1-e2)*900, R=hpx/2;
  g.save(); g.globalCompositeOperation='lighter'; const tr=g.createLinearGradient(cx,cy,cx+R*3,cy-R*5); tr.addColorStop(0,'rgba(255,170,40,.85)'); tr.addColorStop(1,'rgba(255,60,0,0)');
  g.fillStyle=tr; g.beginPath(); g.moveTo(cx-R*.9,cy-R*.2); g.lineTo(cx+R*3.2+Math.sin(t*23)*20,cy-R*5.2); g.lineTo(cx+R*.8,cy+R*.5); g.closePath(); g.fill(); g.restore();
  glow(cx,cy,R*1.8,'rgba(255,130,20,A)',.7); rock(cx,cy,R,kind,Math.sin(t*1.5)*.06);
  if(q>.6){ const x=kind<2?960:1010, top=base-hpx; g.strokeStyle='#fff'; g.lineWidth=6; g.beginPath(); g.moveTo(x,top); g.lineTo(x,base); g.moveTo(x-22,top); g.lineTo(x+22,top); g.moveTo(x-22,base); g.lineTo(x+22,base); g.stroke(); } }

// 3. Explosión en el aire sobre una ciudad nevada.
function snowCity(base,t,dim=1){ for(let i=0;i<9;i++){ const x=i*130-40, h=150+rnd(i*3.7)*230; building(x,base,120,h,'#3c4a63',i+70,'#ffe9b0',.25); g.fillStyle='#eef3fb'; g.fillRect(x-4,base-h-10,128,14); }

  if(t>=T('h2')&&t<T('s1a')){ ti.style.display=su.style.display='block'; ti.innerHTML='What if a <b>meteor</b> hits?'; pop(ti,t,T('h2'),1.6,.16);
    su.textContent='3 sizes'; const t3=T('h2')+D('h2')*.62; su.style.visibility=t>=t3?'visible':'hidden'; pop(su,t,t3,2,.12); }
  else ti.style.display=su.style.display='none';
  const secs=[['s1a','s2a','20 m',0],['s2a','s3a','60 m',1],['s3a','f1','10 km',2]]; const nu=$('num'), la=$('lab'), pp=$('pips');

    let cur=null; for(const s of TL.segs) if(t>=s.start) cur=s; la.textContent=labs[cur.id]||''; pop(la,t,cur.start+.12,1.4,.12);

  const cp=$('cap'); let cc=null; for(const s of TL.segs) for(const q of s.caps) if(t>=q.t0&&t<q.t1&&!(s.id==='h2'&&q.t0<s.start+s.dur*.6)) cc=q;
