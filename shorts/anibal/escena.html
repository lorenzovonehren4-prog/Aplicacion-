<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>

#date{top:170px;font-size:150px;color:#ffcf3a;-webkit-text-stroke:22px #000;letter-spacing:-4px}

#lower{position:absolute;left:60px;top:1010px;padding:16px 30px 18px;background:#14100c;border-left:14px solid #ffcf3a;color:#fff;font-size:54px;letter-spacing:1px;box-shadow:0 10px 0 #000;white-space:nowrap}

#tag{position:absolute;right:28px;top:34px;font-size:24px;color:#ffffffaa;letter-spacing:2px;font-weight:700}
</style></head><body>
<div id="stage">
  <canvas id="sc" width="1080" height="1920"></canvas>

</div>
<script>
// «Aníbal»: cada cuadro se dibuja con código en función de t. Ver PLAN.md para el storyboard.
const TL=window.__TL__, W=1080, H=1920, $=id=>document.getElementById(id);
const S={}; TL.segs.forEach(s=>S[s.id]=s);
const T=id=>S[id].start, D=id=>S[id].dur, E=id=>S[id].start+S[id].dur;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,k)=>a+(b-a)*k, k01=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const eio=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2, eout=k=>1-Math.pow(1-k,3), ein=k=>k*k*k, esm=k=>k*k*(3-2*k);
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}, mod=(a,n)=>((a%n)+n)%n;
const c=$('sc').getContext('2d'), fxc=$('fx').getContext('2d');

// ================= FICHAS DE PERSONAJE (no cambian entre escenas) =================
const ANIBAL ={skin:'#b47b4e',hair:'#16100c',hairStyle:'curly',beard:'#16100c',tunic:'#efe2c4',armor:'#c99a3e',cloak:'#5b2373',trim:'#e7b73c',h:560};
const ANIBAL_NINO={...ANIBAL,beard:null,hairStyle:'curlyShort',armor:null,cloak:null,tunic:'#f2e8d2',belt:'#5b2373',h:330};
const ANIBAL_VIEJO={...ANIBAL,hair:'#9a958d',beard:'#a7a29a',armor:null,tunic:'#4a3a5a',cloak:'#2e1d3a'};
const AMILCAR={skin:'#a87048',hair:'#3b3330',hairStyle:'short',beard:'#5e5651',beardLong:true,tunic:'#e4d6b6',armor:'#a8823a',cloak:'#7a1f2a',trim:'#d9a93a',h:600};
const MAHARBAL={skin:'#c08a5c',hair:'#4a2f1c',hairStyle:'short',beard:'#4a2f1c',tunic:'#d9cba8',armor:'#7a5534',cloak:'#2f6b45',trim:'#c9a24a',h:540};
const ESCIPION={skin:'#e2b892',hair:'#6b4a2e',hairStyle:'short',beard:null,tunic:'#b82127',armor:'#d4a64a',cloak:'#c4252b',trim:'#f0d38a',h:550,helmet:false};
const SOLD_C=i=>({skin:['#b47b4e','#8a5a38','#c99a6e','#6e4428'][i%4],hair:'#1d140e',hairStyle:i%2?'short':'curlyShort',beard:i%3==0?'#1d140e':null,tunic:['#d8c8a0','#3d5e8c','#c9b48a','#8a3a2a'][i%4],armor:null,cloak:null,h:300,shield:'round',shieldCol:['#7a5534','#5b2373','#a8823a'][i%3],spear:true});
const SOLD_R=i=>({skin:['#e2b892','#d8a87e','#c9956a'][i%3],hair:'#3a2a1c',hairStyle:'short',beard:null,tunic:'#b82127',armor:'#9aa0a8',cloak:null,h:300,helmet:true,shield:'scutum',shieldCol:'#a81e24',spear:true});

// ================= DIBUJO DE PERSONAJES =================
function limb(x,y,a1,l1,a2,l2,w,col){ // dos tramos: ángulo 0 = hacia abajo
  const ex=x+Math.sin(a1)*l1, ey=y+Math.cos(a1)*l1, hx=ex+Math.sin(a2)*l2, hy=ey+Math.cos(a2)*l2;
  c.lineCap='round'; c.lineJoin='round';
  c.strokeStyle='#0b0806'; c.lineWidth=w+7; c.beginPath(); c.moveTo(x,y); c.lineTo(ex,ey); c.lineTo(hx,hy); c.stroke();
  c.strokeStyle=col; c.lineWidth=w; c.beginPath(); c.moveTo(x,y); c.lineTo(ex,ey); c.lineTo(hx,hy); c.stroke();
  return [hx,hy];
}
function person(P,o){
  const s=o.s||1, Hh=P.h*s, x=o.x, y=o.y, lk=o.look||1, t=o.t||0;
  const hr=Hh*.115, hy=y-Hh+hr, shY=y-Hh*.73, hipY=y-Hh*.43, lw=Hh*.052, ow=Math.max(3,Hh*.011);
  const ph=o.walk, sw=ph==null?0:Math.sin(ph);
  const breath=Math.sin(t*2.2+(o.seed||0))*Hh*.004;
  c.save(); c.translate(0,breath);
  // sombra
  c.fillStyle='rgba(0,0,0,.28)'; c.beginPath(); c.ellipse(x,y+4,Hh*.2,Hh*.03,0,0,7); c.fill();
  // capa (detrás) con viento
  if(P.cloak){ const wv=(o.wind||.3), fl=Math.sin(t*5+(o.seed||0))*Hh*.03*wv;
    c.fillStyle=P.cloak; c.strokeStyle='#0b0806'; c.lineWidth=ow;
    c.beginPath(); c.moveTo(x-Hh*.14,shY-Hh*.02); c.lineTo(x+Hh*.14,shY-Hh*.02);
    c.quadraticCurveTo(x+Hh*.2-lk*Hh*.05*wv,y-Hh*.3,x+Hh*.17-lk*(Hh*.14*wv)+fl,y-Hh*.12);
    c.lineTo(x-Hh*.17-lk*(Hh*.16*wv)+fl*1.4,y-Hh*.1); c.quadraticCurveTo(x-Hh*.2-lk*Hh*.05*wv,y-Hh*.3,x-Hh*.14,shY-Hh*.02); c.fill(); c.stroke();
    if(P.trim){ c.strokeStyle=P.trim; c.lineWidth=ow*1.3; c.beginPath(); c.moveTo(x+Hh*.17-lk*(Hh*.14*wv)+fl,y-Hh*.12); c.lineTo(x-Hh*.17-lk*(Hh*.16*wv)+fl*1.4,y-Hh*.1); c.stroke(); } }
  // piernas
  const leg=P.legs||'#3a2a1e', la=o.legs||[sw*.42,-sw*.42];
  for(const [i,a] of [[0,la[0]],[1,la[1]]]){ const lx=x+(i?1:-1)*Hh*.055; const knee=ph==null?0:Math.max(0,Math.sin(ph+(i?Math.PI:0)))*.35;
    const [fx,fy]=limb(lx,hipY,a,Hh*.22,a-knee,Hh*.22,lw,P.skin);
    c.fillStyle='#4a3020'; c.strokeStyle='#0b0806'; c.lineWidth=ow; c.beginPath(); c.ellipse(fx+lk*Hh*.02,fy,Hh*.045,Hh*.022,0,0,7); c.fill(); c.stroke(); }
  // brazos (posición)
  const aB=o.armB||[-lk*.15-sw*.35,-lk*.05], aF=o.armF||[lk*.15+sw*.35,lk*.3];
  const sxB=x-lk*Hh*.13, sxF=x+lk*Hh*.13;
  limb(sxB,shY+Hh*.02,aB[0],Hh*.17,aB[1],Hh*.16,lw*.9,P.skin);
  // torso
  c.strokeStyle='#0b0806'; c.lineWidth=ow;
  c.fillStyle=P.tunic; c.beginPath(); c.moveTo(x-Hh*.13,shY-Hh*.02); c.lineTo(x+Hh*.13,shY-Hh*.02); c.lineTo(x+Hh*.155,hipY+Hh*.1); c.lineTo(x-Hh*.155,hipY+Hh*.1); c.closePath(); c.fill(); c.stroke();
  if(P.armor){ const g=c.createLinearGradient(x-Hh*.14,0,x+Hh*.14,0); g.addColorStop(0,P.armor); g.addColorStop(.45,'#fff3c8'); g.addColorStop(.55,P.armor); g.addColorStop(1,'#5a4320');
    c.fillStyle=g; c.beginPath(); c.moveTo(x-Hh*.135,shY-Hh*.03); c.lineTo(x+Hh*.135,shY-Hh*.03); c.lineTo(x+Hh*.12,hipY); c.lineTo(x-Hh*.12,hipY); c.closePath(); c.fill(); c.stroke();
    c.strokeStyle='rgba(60,40,10,.6)'; c.lineWidth=ow*.7; c.beginPath(); c.moveTo(x,shY+Hh*.02); c.lineTo(x,hipY-Hh*.03); c.moveTo(x-Hh*.08,shY+Hh*.1); c.quadraticCurveTo(x,shY+Hh*.14,x+Hh*.08,shY+Hh*.1); c.stroke();
    c.fillStyle='#5a3a1e'; c.strokeStyle='#0b0806'; c.lineWidth=ow; for(let i=-2;i<=2;i++){ c.fillRect(x+i*Hh*.052-Hh*.022,hipY,Hh*.044,Hh*.09); c.strokeRect(x+i*Hh*.052-Hh*.022,hipY,Hh*.044,Hh*.09); } }
  if(P.belt){ c.fillStyle=P.belt; c.fillRect(x-Hh*.14,hipY-Hh*.02,Hh*.28,Hh*.035); }
  // brazo delantero, escudo y lanza
  const [hx,hy2]=limb(sxF,shY+Hh*.02,aF[0],Hh*.17,aF[1],Hh*.16,lw*.9,P.skin);
  if(P.spear){ c.strokeStyle='#5a3a1e'; c.lineWidth=Hh*.018; c.beginPath(); c.moveTo(hx,hy2+Hh*.25); c.lineTo(hx+lk*Hh*.06,hy2-Hh*.55); c.stroke(); c.fillStyle='#c8ccd2'; c.beginPath(); c.moveTo(hx+lk*Hh*.06,hy2-Hh*.62); c.lineTo(hx+lk*Hh*.06-Hh*.02,hy2-Hh*.53); c.lineTo(hx+lk*Hh*.06+Hh*.02,hy2-Hh*.53); c.fill(); }
  if(P.shield){ const sx=x-lk*Hh*.02, sy=shY+Hh*.2; c.fillStyle=P.shieldCol; c.strokeStyle='#0b0806'; c.lineWidth=ow*1.2;
    if(P.shield==='round'){ c.beginPath(); c.arc(sx,sy,Hh*.15,0,7); c.fill(); c.stroke(); c.fillStyle='#d9b45a'; c.beginPath(); c.arc(sx,sy,Hh*.04,0,7); c.fill(); c.stroke(); }
    else { c.beginPath(); c.roundRect(sx-Hh*.1,sy-Hh*.18,Hh*.2,Hh*.36,Hh*.03); c.fill(); c.stroke(); c.strokeStyle='#e8c25a'; c.lineWidth=ow; c.beginPath(); c.moveTo(sx,sy-Hh*.16); c.lineTo(sx,sy+Hh*.16); c.stroke(); } }
  if(o.cup){ c.fillStyle='#b98a3a'; c.strokeStyle='#0b0806'; c.lineWidth=ow; c.beginPath(); c.moveTo(hx-Hh*.04,hy2-Hh*.05); c.lineTo(hx+Hh*.04,hy2-Hh*.05); c.lineTo(hx+Hh*.02,hy2+Hh*.02); c.lineTo(hx-Hh*.02,hy2+Hh*.02); c.closePath(); c.fill(); c.stroke(); }
  // cabeza
  c.fillStyle=P.skin; c.strokeStyle='#0b0806'; c.lineWidth=ow*1.1; c.beginPath(); c.arc(x,hy,hr,0,7); c.fill(); c.stroke();
  const f=o.face||{};
  // barba
  if(P.beard){ c.fillStyle=P.beard; c.beginPath(); c.moveTo(x-hr*.92,hy+hr*.05); c.quadraticCurveTo(x-hr*.8,hy+hr*(P.beardLong?1.55:1.25),x,hy+hr*(P.beardLong?1.65:1.3)); c.quadraticCurveTo(x+hr*.8,hy+hr*(P.beardLong?1.55:1.25),x+hr*.92,hy+hr*.05); c.quadraticCurveTo(x,hy+hr*.55,x-hr*.92,hy+hr*.05); c.fill(); c.stroke(); }
  // pelo
  c.fillStyle=P.hair;
  if(P.hairStyle==='curly'||P.hairStyle==='curlyShort'){ const n=P.hairStyle==='curly'?9:7; for(let i=0;i<n;i++){ const a=Math.PI*(1.02+i/(n-1)*.96); c.beginPath(); c.arc(x+Math.cos(a)*hr*.88,hy+Math.sin(a)*hr*.88-hr*.05,hr*.3,0,7); c.fill(); } c.beginPath(); c.arc(x,hy-hr*.35,hr*.75,Math.PI*1.05,Math.PI*1.95); c.fill(); }
  else { c.beginPath(); c.arc(x,hy-hr*.05,hr*1.03,Math.PI*1.05,Math.PI*1.95); c.quadraticCurveTo(x,hy-hr*.55,x-hr*1.0,hy-hr*.2); c.fill(); }
  // ojos, cejas, boca
  const ex=lk*hr*.14, eyT=f.eyes||'n', blink=(mod(t+(o.seed||0)*1.7,3.6)<.12)||eyT==='c';
  for(const sd of [-1,1]){ const cx=x+sd*hr*.36+ex, cy=hy-hr*.05;
    if(blink){ c.strokeStyle='#0b0806'; c.lineWidth=ow*1.1; c.beginPath(); c.moveTo(cx-hr*.13,cy); c.lineTo(cx+hr*.13,cy); c.stroke(); }
    else { c.fillStyle='#fff'; c.beginPath(); c.ellipse(cx,cy,hr*.15,hr*(eyT==='w'?.2:eyT==='s'?.08:.15),0,0,7); c.fill(); c.fillStyle='#120c08'; c.beginPath(); c.arc(cx+lk*hr*.04,cy+hr*.01,hr*(eyT==='w'?.075:.085),0,7); c.fill(); }
    if(o.patch&&sd===-lk){ c.fillStyle='#120c08'; c.beginPath(); c.ellipse(cx,cy,hr*.19,hr*.17,0,0,7); c.fill(); }
    const b=f.brow||0; c.strokeStyle=P.hairStyle&&P.hair==='#9a958d'?'#6e6a64':'#120c08'; c.lineWidth=ow*1.5; c.beginPath(); c.moveTo(cx-sd*hr*-.17,cy-hr*.27-sd*b*hr*-.0); c.lineTo(cx+sd*hr*.17,cy-hr*.27+b*hr*.12); c.stroke(); }
  if(o.patch){ c.strokeStyle='#120c08'; c.lineWidth=ow; c.beginPath(); c.moveTo(x-hr*.95,hy-hr*.3); c.lineTo(x+hr*.95,hy-hr*.15); c.stroke(); }
  const mo=f.mouth||'n', talk=o.talk?Math.abs(Math.sin(t*17+(o.seed||0)))*.9+.1:0, my=hy+hr*.45;
  c.strokeStyle='#120c08'; c.fillStyle='#4a1810'; c.lineWidth=ow*1.2;
  if(talk>0||mo==='o'){ c.beginPath(); c.ellipse(x+ex*.6,my,hr*.17,hr*(.05+.13*(mo==='o'?1:talk)),0,0,7); c.fill(); c.stroke(); }
  else { c.beginPath(); const cv=mo==='s'?.12:mo==='f'?-.12:mo==='g'?-.05:0; c.moveTo(x+ex*.6-hr*.2,my-cv*hr*.4); c.quadraticCurveTo(x+ex*.6,my+cv*hr,x+ex*.6+hr*.2,my-cv*hr*.4); c.stroke(); }
  // casco romano
  if(P.helmet){ c.fillStyle='#9aa0a8'; c.strokeStyle='#0b0806'; c.lineWidth=ow; c.beginPath(); c.arc(x,hy-hr*.1,hr*1.05,Math.PI,0); c.fill(); c.stroke(); c.fillRect(x-hr*1.05,hy-hr*.12,hr*.3,hr*.6); c.fillRect(x+hr*.75,hy-hr*.12,hr*.3,hr*.6);
    c.fillStyle='#b82127'; c.beginPath(); c.ellipse(x,hy-hr*1.2,hr*.7,hr*.28,0,0,7); c.fill(); c.stroke(); }
  c.restore();
}
function elephant(x,y,s,ph,dir=1,rider){
  c.save(); c.translate(x,y); c.scale(s*dir,s); c.lineJoin='round'; c.strokeStyle='#0b0806'; c.lineWidth=6;
  c.fillStyle='rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(0,4,190,22,0,0,7); c.fill();
  const leg=(lx,o,dark)=>{ const a=Math.sin(ph+o)*.25; c.save(); c.translate(lx,-120); c.rotate(a); c.fillStyle=dark?'#5f6168':'#787a82'; c.beginPath(); c.roundRect(-24,0,48,120,14); c.fill(); c.stroke(); c.restore(); };
  leg(-80,Math.PI,1); leg(70,0,1);
  c.fillStyle='#80828a'; c.beginPath(); c.ellipse(-10,-185,145,90,0,0,7); c.fill(); c.stroke();
  leg(-110,0,0); leg(40,Math.PI,0);
  c.fillStyle='#5b2373'; c.beginPath(); c.moveTo(-90,-262); c.lineTo(50,-262); c.lineTo(60,-175); c.lineTo(-100,-175); c.closePath(); c.fill(); c.stroke();
  c.fillStyle='#e7b73c'; c.fillRect(-100,-185,160,10);
  c.fillStyle='#80828a'; c.beginPath(); c.arc(130,-205,62,0,7); c.fill(); c.stroke();
  const tr=Math.sin(ph*.5)*20; c.lineWidth=34; c.strokeStyle='#0b0806'; c.beginPath(); c.moveTo(170,-195); c.quadraticCurveTo(205,-120,185+tr*.4,-40); c.stroke(); c.lineWidth=22; c.strokeStyle='#80828a'; c.beginPath(); c.moveTo(170,-195); c.quadraticCurveTo(205,-120,185+tr*.4,-40); c.stroke();
  c.strokeStyle='#0b0806'; c.lineWidth=6; c.fillStyle='#f4ecd8'; c.beginPath(); c.moveTo(160,-170); c.quadraticCurveTo(205,-150,215,-180); c.lineTo(205,-170); c.quadraticCurveTo(195,-158,165,-160); c.fill(); c.stroke();
  c.fillStyle='#6a6c73'; c.beginPath(); c.ellipse(105,-205,40,58,-.2,0,7); c.fill(); c.stroke();
  c.fillStyle='#0b0806'; c.beginPath(); c.arc(150,-222,7,0,7); c.fill();
  c.restore();
  if(rider) person(rider.P,{...rider,x:x-10*s*dir,y:y-262*s,s:(rider.s||.6)*s/1});
}

// ================= CÁMARA (paralaje por capas) =================
let CAM={x:540,y:960,z:1,r:0}, SHAKE=0;
function camAt(keys,t){ if(t<=keys[0][0]) return keys[0]; for(let i=0;i<keys.length-1;i++){ const a=keys[i],b=keys[i+1]; if(t<=b[0]){ const e=(b[5]||eio)(k01(t,a[0],b[0])); return [t,lerp(a[1],b[1],e),lerp(a[2],b[2],e),lerp(a[3],b[3],e),lerp(a[4]||0,b[4]||0,e)]; } } return keys[keys.length-1]; }
function setCam(keys,t){ const k=camAt(keys,t); CAM={x:k[1],y:k[2],z:k[3],r:k[4]||0}; }
function layer(d){ const z=Math.pow(CAM.z,d), sx=SHAKE*(Math.sin(TT*63)+Math.sin(TT*41.7))*.5, sy=SHAKE*(Math.sin(TT*57)+Math.sin(TT*33.1))*.5;
  c.setTransform(1,0,0,1,0,0); c.translate(W/2+sx,H/2+sy); c.rotate(CAM.r*d); c.scale(z,z); c.translate(-(W/2+(CAM.x-W/2)*d),-(H/2+(CAM.y-H/2)*d)); }
let TT=0;

// ================= PIEZAS DE ESCENARIO =================
function grad(c0,c1,c2){ c.save(); c.setTransform(1,0,0,1,0,0); const g=c.createLinearGradient(0,0,0,H); g.addColorStop(0,c0); g.addColorStop(.62,c1); g.addColorStop(1,c2||c1); c.fillStyle=g; c.fillRect(0,0,W,H); c.restore(); }
function glow(x,y,r,col,a){ c.save(); c.globalCompositeOperation='lighter'; const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,col.replace('A',a)); g.addColorStop(1,col.replace('A',0)); c.fillStyle=g; c.beginPath(); c.arc(x,y,r,0,7); c.fill(); c.restore(); }
function flame(x,y,w,h,t,seed){ c.save(); c.globalCompositeOperation='lighter';
  for(const [sc,col] of [[1,'rgba(255,70,10,.8)'],[.7,'rgba(255,155,30,.85)'],[.4,'rgba(255,238,160,.9)']]){ const hh=h*sc*(.85+.15*Math.sin(t*11+seed*3)), ww=w*sc, tip=Math.sin(t*7.3+seed)*w*.22;

  const sc= t<T('g2a')||t>=T('f2')?'templo': t<T('c1')?'colina': t<T('a1')||(t>=T('b1')&&t<T('k1')+D('k1')*.42)||(t>=T('e1')&&t<T('e2'))||(t>=T('e2')+D('e2')*.42&&t<T('z1'))?'mapa': t<T('b1')?'alpes': t<T('m1')?'cannas': t<T('e1')?'colina': t<T('z1')?'colina': t<T('f1')?'zama':'final';

  // título
  const ti=$('title'); if(t>=T('g2b')&&t<T('c1')){ show(ti,1); ti.innerHTML='ANÍBAL<small>EL HOMBRE QUE CASI DESTRUYE ROMA</small>'; pop(ti,t,T('g2b'),2.2,.18); }
  else if(t>=E('f2')-.2){ show(ti,1); ti.innerHTML='ANÍBAL BARCA<small>247 – c. 183 a. C.</small>'; ti.style.fontSize='130px'; pop(ti,t,E('f2')-.2,1.6,.25); } else { show(ti,0); ti.style.fontSize=''; }
  // fechas
  const dates=[[T('c2'),T('r1'),'221 a. C.'],[T('r1'),T('r2a'),'218 a. C.'],[T('k1')+.2,T('k1')+D('k1')*.42,'216 a. C.'],[T('z1'),T('z1')+D('z1')*.5,'202 a. C.']];
  const dt=$('date'); let dOn=null; for(const d of dates) if(t>=d[0]&&t<d[1]) dOn=d; if(dOn){ show(dt,1); dt.textContent=dOn[2]; pop(dt,t,dOn[0],1.8,.14); } else show(dt,0);
  // contadores
  const ct=$('count'); let cOn=null;
  if(t>=T('a2')&&t<T('b1')){ const n=Math.round(lerp(59000,26000,eio(k01(t,T('a2')+.2,E('a2'))))); cOn=[n.toLocaleString('es-ES'),'SOLDADOS',T('a2')]; }
  else if(t>=T('k1')+D('k1')*.42&&t<T('k2a')){ cOn=['<span style="color:#ff6a60">+80.000</span> vs <span style="color:#e6b8ff">50.000</span>','ROMA · ANÍBAL',T('k1')+D('k1')*.42]; }
  else if(t>=T('k4b')+D('k4b')*.5&&t<T('m1')){ cOn=['<span style="color:#ff3b30">50.000–70.000</span>','MUERTOS EN UNA TARDE',T('k4b')+D('k4b')*.5]; }
  if(cOn){ show(ct,1); ct.innerHTML=cOn[0]+'<small>'+cOn[1]+'</small>'; pop(ct,t,cOn[2],1.5,.14); } else show(ct,0);
  // rótulos de nombre
  const lw=$('lower'); const names=[[T('g1')+.2,T('g2a'),'AMÍLCAR Y SU HIJO ANÍBAL','CARTAGO · c. 238 a. C.'],[T('m2'),E('m3'),'MAHARBAL','JEFE DE CABALLERÍA'],[T('e2')+.3,T('e2')+D('e2')*.42,'PUBLIO CORNELIO ESCIPIÓN','GENERAL ROMANO']];
  let nOn=null; for(const n of names) if(t>=n[0]&&t<n[1]) nOn=n; if(nOn){ show(lw,1); lw.innerHTML=nOn[2]+'<small>'+nOn[3]+'</small>'; const k=eout(k01(t,nOn[0],nOn[0]+.3)); lw.style.transform=`translateX(${(1-k)*-700}px)`; } else show(lw,0);
  // cita
  const qt=$('quote'); if(t>=T('m3')&&t<E('m3')+.25){ show(qt,1); qt.innerHTML='«Sabes vencer, Aníbal, pero no sabes aprovechar la victoria.»<small>— MAHARBAL, SEGÚN TITO LIVIO</small>'; pop(qt,t,T('m3'),1.1,.2); } else show(qt,0);
  // subtítulos
  const cp=$('cap'); let cc=null; for(const s of TL.segs) if(s.id!=='m3') for(const q of s.caps) if(t>=q.t0&&t<q.t1) cc=q;
  if(cc){ show(cp,1); if(cp.dataset.c!==cc.txt){ cp.dataset.c=cc.txt; cp.innerHTML=hl(cc.txt); } pop(cp,t,cc.t0,1.25,.08); } else show(cp,0);
};
