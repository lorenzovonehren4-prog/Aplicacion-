document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });

/* ---------- bucle ---------- */
let last = performance.now();
function frame(t) {
  let dt = (t - last) / 1000; last = t;
  if (!(dt > 0)) dt = 0; if (dt > 0.05) dt = 0.05;
  if (G) {
    if (pressed.has('pausa') || pressed.has('mapa')) { if (screen === 'play') pause(); else if (screen === 'pausa') resume(); }
    if (screen !== 'pausa' && !(screen === 'opciones' && optFrom === 'pausa')) {
      if (screen === 'play' && !G.done && pressed.has('bocina')) horn();
      update(dt);
      if (G.attract && G.p.wy > G.R.length - 1500) startAttract();
    }
    render();
    if (screen === 'play' || screen === 'pausa') updateHUD();
    if (AU.ctx && AU.engG) {
      const on = screen === 'play' && !G.attract;
      AU.engG.gain.setTargetAtTime(on ? 0.03 + G.p.v / 540 * 0.035 : 0, AU.ctx.currentTime, 0.15);
      AU.eng.frequency.setTargetAtTime(38 + G.p.v * 0.1, AU.ctx.currentTime, 0.1);
    }
  }
  pressed.clear();
  requestAnimationFrame(frame);
}

isTouch = !!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches) || 'ontouchstart' in window;
loadSave();
resize();
let booted = false;
function boot() {
  if (booted) return; booted = true;
  initTextures(); initMats(); initWorldMeshes(); initEnv(); applyQuality();
  startAttract();
  show('menu');
  document.body.classList.add('ready');
  requestAnimationFrame(frame);
}
const fontsReady = document.fonts && document.fonts.load ? Promise.all([document.fonts.load('40px Bungee'), document.fonts.load('800 16px Rubik')]) : Promise.resolve();
Promise.race([fontsReady, new Promise(r => setTimeout(r, 1800))]).then(boot, boot);
window.__combi = {
  snap() { const p = G.p; wpos(p.wy - 215 - p.v * 0.09, 270 + (p.x - 270) * 0.55, 122 + p.v * 0.03, camPos); wpos(p.wy + 280, 270 + (p.x - 270) * 0.72, 16, camLook); },
  step(n) { for (let i = 0; i < n; i++) { update(1 / 30); pressed.clear(); } },
  get G() { return G; }, TUT_STEPS, rivalsFor, startRun, update, render, show, horn, save, showResults, sorteoViaje, lightState, laneFree, laneX, avgMood, nextTurn,
};

})();
