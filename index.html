<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="MIND ESCAPE — 30 desafíos, 1 salida. Juego de puzzles y acertijos interactivos." />
  <title>MIND ESCAPE — 30 desafíos, 1 salida</title>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a1a'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' fill='none' stroke='%2300d4ff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

  <!-- Las fuentes son una mejora progresiva: si no cargan (sin red), las
       pilas de respaldo de main.css mantienen el juego perfectamente legible. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles/main.css" />
  <link rel="stylesheet" href="styles/components/glass-card.css" />
  <link rel="stylesheet" href="styles/components/star-rating.css" />
  <link rel="stylesheet" href="styles/components/timer.css" />
  <link rel="stylesheet" href="styles/components/hint-panel.css" />
  <link rel="stylesheet" href="styles/screens/menu.css" />
  <link rel="stylesheet" href="styles/screens/level-select.css" />
  <link rel="stylesheet" href="styles/screens/level.css" />
  <link rel="stylesheet" href="styles/screens/settings.css" />
</head>
<body>
  <canvas id="particles" aria-hidden="true"></canvas>

  <!-- El router monta cada pantalla dentro de #app -->
  <main id="app" class="app"></main>

  <!-- Capa para modales (nivel completado, confirmaciones) -->
  <div id="overlay-root" class="overlay-root"></div>

  <!-- Región viva para lectores de pantalla -->
  <div id="live-region" class="sr-only" role="status" aria-live="polite"></div>

  <noscript>
    <p style="padding:2rem;color:#e6edf3;font-family:sans-serif">
      MIND ESCAPE necesita JavaScript para funcionar.
    </p>
  </noscript>

  <script type="module" src="js/core/game.js"></script>
</body>
</html>
